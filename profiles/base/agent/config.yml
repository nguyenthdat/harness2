bash:
  enabled: true
  autoBackground:
    enabled: true
    thresholdMs: 60000
lsp:
  enabled: true
  lazy: true
  shared: true
  diagnosticsOnWrite: true
  diagnosticsOnEdit: false
  formatOnWrite: false
disabledProviders:
  - claude
  - opencode
  - codex
  - gemini
  - github
  - agents
  - agents-md
  - amazon-bedrock
  - bedrock-mantle
compaction:
  enabled: true
  midTurnEnabled: true
  thresholdPercent: 85
  thresholdTokens: -1
  autoContinue: true
  idleEnabled: true
  idleThresholdTokens: 700000
  idleTimeoutSeconds: 300
  methodOrder:
    - remote
    - snapcompact
    - handoff
    - shake
    - soft
  handoffSaveToDisk: true
edit:
  mode: hashline
  fuzzyMatch: false
  blockAutoGenerated: true
modelRoles:
  default: omniroute/antigravity/gemini-3.8-flash-high
  plan: "@default"
  slow: "@default"
  task: "@default"
  advisor: "@default"
  rust: "@default"
  python: "@default"
  smol: omniroute/antigravity/gemini-3.8-flash-high
  vision: omniroute/antigravity/gemini-3.8-flash-high
  designer: "@default"
  commit: omniroute/antigravity/gemini-3.8-flash-high
  tiny: omniroute/antigravity/gemini-3.8-flash-high
  architect: "@default"
  implementer: "@default"
  debugger: "@default"
  qa: "@default"
  scout: "@default"
  research: "@default"
  mechanic: omniroute/antigravity/gemini-3.8-flash-high
  devops: "@default"
  codebase-memory: "@default"
advisor:
  enabled: false
  syncBacklog: "off"
task:
  maxConcurrency: 4
  maxRecursionDepth: 1
  eager: preferred
  enableEffort: true
  enableLsp: true
  prewalk: false
  showResolvedModelBadge: true
  agentModelOverrides:
    scout: "@scout"
    codebase-memory-scout: "@codebase-memory"
    codebase-memory: "@codebase-memory"
    codebase-memory-auditor: "@codebase-memory"
    reviewer: "@qa"
    security-reviewer: "@qa"
    task: "@implementer"
    sonic: "@mechanic"
    devops: "@devops"
theme:
  dark: graphite
  light: light
setupVersion: 2
composer:
  shape: box
retry:
  enabled: true
  maxRetries: 10
  baseDelayMs: 500
  maxDelayMs: 300000
  modelFallback: false
steeringMode: one-at-a-time
followUpMode: one-at-a-time
interruptMode: immediate
contextPromotion:
  enabled: true
branchSummary:
  enabled: true
omitThinking: true
extendedContext: true
