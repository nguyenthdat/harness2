# Example Ansible SSH Inventory for macOS VM Provisioning
# Adjust host IP, SSH user, and SSH key or password to match your guest VM.
#
# Prerequisite: "Remote Login" (SSH) enabled in macOS System Settings -> General -> Sharing.
# Supported Hypervisors: UTM (Apple Silicon Apple Virtualization framework with macOS IPSW)

[macos_vms]
# Example 1: Direct VM IP with SSH key
macos-re-vm ansible_host=192.168.64.30 ansible_user=analyst ansible_ssh_private_key_file=~/.ssh/id_ed25519

# Example 2: Host port-forwarded VM (e.g. UTM NAT port forwarding 2223 -> 22)
# macos-utm-nat ansible_host=127.0.0.1 ansible_port=2223 ansible_user=analyst ansible_ssh_pass=labpassword

[macos_vms:vars]
# Standard SSH connection settings
ansible_connection=ssh
ansible_port=22

# Privilege escalation: Homebrew runs unprivileged as ansible_user.
# Tasks requiring root (firewall, /opt/ida_dbgsrv staging) use become: true individually.
ansible_become=false
ansible_become_method=sudo
# ansible_become_password=labpassword

# Host key checking behavior (set false for disposable local lab VMs)
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# Python interpreter discovery on macOS (Homebrew or system python3)
ansible_python_interpreter=/usr/bin/python3
