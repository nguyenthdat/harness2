# Example Ansible SSH Inventory for Linux VM Provisioning
# Adjust host IP, SSH user, and SSH key or password to match your guest VM.
#
# Supported Distros: Debian, Ubuntu, Fedora, Arch Linux
# Supported Hypervisors: UTM (Apple Silicon/Intel), KVM/QEMU, Proxmox, VMware

[linux_vms]
# Example 1: Direct VM IP with SSH key
linux-re-vm ansible_host=192.168.64.20 ansible_user=analyst ansible_ssh_private_key_file=~/.ssh/id_ed25519

# Example 2: Host port-forwarded VM (e.g. UTM NAT port forwarding 2222 -> 22)
# linux-utm-nat ansible_host=127.0.0.1 ansible_port=2222 ansible_user=analyst ansible_ssh_pass=labpassword

[linux_vms:vars]
# Standard SSH connection settings
ansible_connection=ssh
ansible_port=22

# Privilege escalation (sudo required for apt/dnf/pacman, sysctl, and firewall setup)
ansible_become=true
ansible_become_method=sudo
# ansible_become_password=labpassword

# Host key checking behavior (set false for disposable local lab VMs)
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# Python interpreter discovery
ansible_python_interpreter=auto_silent
