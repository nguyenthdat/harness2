# Example Ansible WinRM Inventory for Windows VM Provisioning
# Adjust host IP, username, and password to match your guest VM.
#
# Supported Hypervisors:
# - UTM on macOS: Host-only network or Shared Network (Port Forward 5985 -> Guest 5985)
# - VMware Fusion / Workstation: Host-only (vmnet1) or NAT (vmnet8)
# - Hyper-V: Default Switch or Internal Switch

[windows_vms]
# Example 1: Direct VM IP (Bridged or Host-Only / NAT with reachable guest IP)
win-re-vm ansible_host=192.168.64.10 ansible_user=Administrator ansible_password=YourSecurePassword123!

# Example 2: Host port-forwarded VM (e.g. UTM Shared Network forwarding 5985 to 59850 on host)
# win-utm-nat ansible_host=127.0.0.1 ansible_port=59850 ansible_user=Administrator ansible_password=YourSecurePassword123!

[windows_vms:vars]
# WinRM connection type
ansible_connection=winrm

# Transport and authentication
# Use 'http' with 'ntlm' or 'basic' for local lab VMs.
# Use 'https' with 'basic', 'ntlm', or 'credssp' if WinRM HTTPS is configured.
ansible_winrm_transport=ntlm
ansible_port=5985
ansible_winrm_server_cert_validation=ignore

# Timeouts: Windows package installations (Wireshark, Ghidra, Python) may take minutes.
ansible_winrm_operation_timeout_sec=120
ansible_winrm_read_timeout_sec=180

# Environment settings
ansible_winrm_scheme=http
