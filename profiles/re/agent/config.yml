web_search:
  enabled: false
fetch:
  enabled: false
browser:
  enabled: false
exa:
  enabled: false
bash:
  enabled: true
  autoBackground:
    enabled: true
    thresholdMs: 60000
lsp:
  enabled: true
  lazy: true
  shared: true
  diagnosticsOnWrite: true
  diagnosticsOnEdit: false
  formatOnWrite: false
disabledProviders:
  - claude
  - opencode
  - codex
  - gemini
  - github
  - agents
  - agents-md
  - amazon-bedrock
  - bedrock-mantle
compaction:
  enabled: true
  midTurnEnabled: true
  thresholdPercent: 85
  thresholdTokens: -1
  autoContinue: true
  idleEnabled: true
  idleThresholdTokens: 700000
  idleTimeoutSeconds: 300
  methodOrder:
    - remote
    - snapcompact
    - handoff
    - shake
    - soft
  handoffSaveToDisk: true
edit:
  mode: hashline
  fuzzyMatch: false
  blockAutoGenerated: true
modelRoles:
  default: deepseek/deepseek-flash
advisor:
  enabled: false
  syncBacklog: "off"
task:
  maxConcurrency: 4
  maxRecursionDepth: 1
  eager: preferred
  enableEffort: true
  enableLsp: true
  prewalk: false
  showResolvedModelBadge: true
theme:
  dark: graphite
  light: light
ida:
  enabled: true
  python: ${OMP_IDA_PYTHON}
  installDir: ${IDA_INSTALLDIR}
  maxOpen: 4
  idleCloseSec: 900
  # remoteDebug:
  #   defaultPort: 23946
  #   connectTimeoutMs: 3000
  #   networkCidr: "10.211.55.0/24"
  #   maxConcurrentConnections: 2
  #   guests:
  #     ubuntu:
  #       ip: "10.211.55.31"
  #       stub: "linux_server64"
  #     winbase:
  #       ip: "10.211.55.22"
  #       stub: "win64_remote.exe"
  #     macos:
  #       ip: "10.211.55.32"
  #       stub: "mac_server_arm"
setupVersion: 2
composer:
  shape: box
retry:
  enabled: true
  maxRetries: 10
  baseDelayMs: 500
  maxDelayMs: 300000
  modelFallback: false
steeringMode: one-at-a-time
followUpMode: one-at-a-time
interruptMode: immediate
contextPromotion:
  enabled: true
branchSummary:
  enabled: true
omitThinking: true
extendedContext: true
